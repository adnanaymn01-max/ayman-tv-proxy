<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030A12"><title>AYMAN TV</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="center"><div class="loginbox"><img src="logo.png" class="logo"><h1><b>AYMAN</b> TV</h1><p>سجّل دخولك للمشاهدة</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">دخول</button><div id="err"></div></div></div>
<div id="app" hidden><header><img src="logo.png"><strong>AYMAN TV</strong><input id="search" placeholder="بحث..."><button id="logout">خروج</button></header><nav><button data-tab="live" class="active">القنوات</button><button data-tab="movies">الأفلام</button><button data-tab="series">المسلسلات</button></nav><main><div id="status"></div><div id="grid" class="grid"></div></main></div>
<div id="playerModal" hidden><div class="playerbar"><span id="playerTitle"></span><button id="closePlayer">✕</button></div><video id="video" controls autoplay playsinline></video></div>
<script src="app.js"></script></body></html>
